<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christmas Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="select" hidden>
    <p id="selectTitle"></p>
    <div id="characters"></div>
  </div>
  <div id="game" hidden>
    <div id="score"></div>
    <p id="turn"></p>
    <p id="message"></p>
    <button id="action" hidden></button>
    <div id="presents"></div>
  </div>
  <div id="scare" hidden><img id="scareImg" alt=""></div>
  <script src="game.js"></script>
</body>
</html>
